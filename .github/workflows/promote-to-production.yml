name: Promote to Production

# Faz o merge da branch `release` em `main` e cria a tag de release.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch a promover para main'
        required: true
        default: 'release'
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge release into main
        run: |
          SRC="${{ inputs.source_branch }}"
          git fetch origin main "$SRC"
          git checkout -B main origin/main
          git merge --no-ff "origin/$SRC" -m "Promote $SRC to production"
          git push origin main

      - name: Create production tag
        run: |
          VERSION=$(date +%Y%m%d-%H%M%S)
          git tag "release-${VERSION}"
          git push origin "release-${VERSION}"
